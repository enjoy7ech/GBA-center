name: Build and release dist

on:
  push:
    branches:
      - "**"

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Generate release timestamp
        run: |
          RELEASE_TIME="$(date +'%Y%m%d-%H%M%S')"
          echo "RELEASE_TIME=$RELEASE_TIME" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=build-$RELEASE_TIME" >> "$GITHUB_ENV"

      - name: Package dist
        run: |
          zip -r "$RELEASE_TAG.zip" dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" "$RELEASE_TAG.zip" \
            --target "$GITHUB_SHA" \
            --title "Build $RELEASE_TIME · ${GITHUB_SHA::7}" \
            --generate-notes
